<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" aria-hidden="true">
  <!-- Sổ Đám · logo mark v3 "Sổ Chàm" (redesign wave 2026-10-23, dựng tay):
       bìa chàm đậm, trang kem kẻ dòng chì đỏ, phong bì sơn mài gài ở trang phải,
       đồng tiền vàng ở chân gáy. Phẳng hoàn toàn — không gradient, không bóng đổ.
       Đọc rõ ở 24px: chỉ 4 khối hình lớn (bìa, 2 trang, phong bì, đồng tiền). -->
  <rect width="512" height="512" rx="104" fill="#1E2456"/>
  <!-- bìa sổ (chàm sâu hơn nền 1 bậc) -->
  <path d="M96 148 Q256 110 416 148 L416 378 Q256 342 96 378 Z" fill="#161A3D"/>
  <!-- trang trái -->
  <path d="M110 158 Q178 134 246 154 L246 358 Q178 338 110 362 Z" fill="#F7F3E8"/>
  <!-- trang phải -->
  <path d="M266 154 Q334 134 402 158 L402 362 Q334 338 266 358 Z" fill="#F7F3E8"/>
  <!-- gáy sổ -->
  <path d="M250 148 L262 148 L262 364 L250 364 Z" fill="#161A3D"/>
  <!-- dòng kẻ chì đỏ — trang trái -->
  <g stroke="#B3352C" stroke-width="9" stroke-linecap="round">
    <path d="M130 208 Q180 192 228 204"/>
    <path d="M130 248 Q180 232 228 244"/>
    <path d="M130 288 Q180 272 228 284"/>
  </g>
  <!-- dòng kẻ chì đỏ — trang phải (phần không bị phong bì che) -->
  <g stroke="#B3352C" stroke-width="9" stroke-linecap="round">
    <path d="M284 204 Q332 192 382 208"/>
    <path d="M284 244 Q310 236 340 240"/>
  </g>
  <!-- phong bì sơn mài gài trang phải, nghiêng nhẹ như vừa đặt xuống -->
  <g transform="rotate(-6 331 292)">
    <rect x="272" y="252" width="118" height="80" rx="6" fill="#B3352C"/>
    <path d="M276 258 L331 296 L386 258" stroke="#F7F3E8" stroke-width="7" fill="none" stroke-linejoin="round"/>
  </g>
  <!-- đồng tiền vàng ở chân gáy -->
  <circle cx="256" cy="386" r="30" fill="#C9A24B" stroke="#161A3D" stroke-width="10"/>
  <circle cx="256" cy="386" r="12" fill="none" stroke="#161A3D" stroke-width="7"/>
</svg>
